name: Deploy

# Deploys each site to Cloudflare Workers when its files change on main.
#   apps/tensaco           -> https://tensaco.ai
#   apps/account           -> https://account.tensaco.ai (sign-in, portal, staff views)
#   apps/phaser            -> https://phaser.tensaco.ai
#   apps/tensorcode-alias  -> https://tensorcode.tensaco.ai (301 to tensorcode.dev)
# Shared code (packages/*) and D1 migrations (Drizzle, migrations/) redeploy the apps that use them; migrations run first.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: a token from the "Edit Cloudflare Workers" template, scoped to
# account 20d4becc… and zone tensaco.ai, plus "Account · D1 · Edit" (migrations) and "Account · Workers R2 Storage · Edit"
# (the résumé bucket binding).
# Worker secrets (RESEND_API_KEY on tensaco-account and tensaco-site) persist across deploys; set them with
# `npx wrangler secret put RESEND_API_KEY` in the app folder. The GitHub secret RESEND_API_KEY is not needed by deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every app regardless of changes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 20d4becc35c40a0bbfb8803a525aaae1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tensaco: ${{ steps.f.outputs.tensaco == 'true' || inputs.all == true }}
      account: ${{ steps.f.outputs.account == 'true' || inputs.all == true }}
      phaser: ${{ steps.f.outputs.phaser == 'true' || inputs.all == true }}
      alias: ${{ steps.f.outputs.alias == 'true' || inputs.all == true }}
      migrations: ${{ steps.f.outputs.migrations }}
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        name: Check for the Cloudflare token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploys."; fi
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            tensaco: ['apps/tensaco/**', 'packages/**', 'migrations/**', 'package-lock.json']
            account: ['apps/account/**', 'packages/**', 'migrations/**', 'package-lock.json']
            phaser: ['apps/phaser/**', 'packages/**', 'migrations/**', 'package-lock.json']
            alias: ['apps/tensorcode-alias/**']
            migrations: ['migrations/**']

  migrate:
    needs: changes
    if: needs.changes.outputs.ready == 'true' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate:remote

  deploy:
    needs: [changes, migrate]
    if: always() && !failure() && !cancelled() && needs.changes.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tensaco, account, phaser]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.app] == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs[matrix.app] == 'true'
        with: { node-version: 22, cache: npm }
      - name: Build and deploy apps/${{ matrix.app }}
        if: needs.changes.outputs[matrix.app] == 'true'
        run: |
          npm ci
          npm run typecheck -w apps/${{ matrix.app }}
          npm run deploy -w apps/${{ matrix.app }}

  alias:
    needs: changes
    if: needs.changes.outputs.ready == 'true' && needs.changes.outputs.alias == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/tensorcode-alias } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y wrangler@4 deploy
