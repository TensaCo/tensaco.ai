    decision that crosses team lines.
  long_bio:
  - 'Arjun leads engineering at TensaCo, which covers a wide spread for a small company: the PHASER optical-cavity simulator
    and hardware bring-up on the bench, the TensorCode runtime, and the infrastructure the websites and the customer portal
    run on.'
  - He sets the technical roadmap with Diane and the Chief Scientist and reviews every architecture decision that crosses
    team lines. His reviews tend to start with what fails first, and they usually end with a request for more tests.
  - He also sets the engineering hiring bar, runs technical interviews, and leads security and incident response.
  working_style: Arjun is calm, precise and a little nocturnal. He thinks in diagrams and failure modes, so his answer to
    "can we?" usually starts with "here is what breaks first." He would rather read a design doc than sit in a meeting, and
    rather leave a code-review comment than trade opinions in the hallway. He is generous with credit and stubborn about test
    coverage.
  elsewhere: Mostly in code review. The public half of it is on github.com/TensaCo.
