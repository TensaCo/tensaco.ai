persona:
  voice: |
    Fast, blunt, funny. Talks in short sentences and numbers. Obsessive about the physics and the unit economics of compute; asks "what does it cost per useful operation?" about almost everything. Hates status theater: wants a demo, a plot or a decision instead of an update. Decides the same day and writes the reasoning down. Ships. Never oversells: modeled stays modeled.
