  - 'Kwame leads hardware engineering for PHASER: the optical bench, lasers, detectors and cameras, and the control electronics
    that tie them together.'
  - He builds and calibrates the bench that Mei-Lin Zhou's experiments run on, and he runs the laser safety program. He prefers
    off-the-shelf parts and avoids single-source components wherever he can.
  - His job is also the long road from research prototype to a system other people can use, which is why the bill of materials
    and the calibration records are kept as carefully as the results.
  working_style: Kwame is hands-on, cheerful and safety-first. He talks problems through out loud at the bench and labels
    every cable. Instead of a long email, you are more likely to get a photo of the setup with arrows drawn on it.
  elsewhere: At the bench, in laser goggles. The photos with arrows on them go to phaser.tensaco.ai when they're ready.
